name: iOS Release

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "fastlane lane"
        required: true
        type: choice
        options: [beta, metadata, release, screenshots, release_notes]
        default: beta
      notes:
        description: "release lane — release notes source"
        required: false
        type: choice
        options:
          - auto # regenerate from the commits since the last ios-v* tag
          - keep # upload fastlane/metadata/<locale>/release_notes.txt as committed
        default: auto
      notes_since:
        description: "Optional git ref to generate the notes against (default: last ios-v* tag)"
        required: false
        type: string
      submit:
        description: "release lane — submit for review and auto-release once approved"
        required: false
        type: boolean
        default: true

permissions:
  contents: write # the release lane pushes the ios-v* tag it releases from

jobs:
  fastlane:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
        with:
          # Build number = git rev-list --count HEAD (both prebuild scripts).
          # A shallow clone yields 1 and App Store Connect rejects any build
          # number at or below the last upload. Full history also gives us the
          # ios-v* tags the release notes are generated against.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Select Xcode 26
        # Apple requires the iOS 26 SDK (Xcode 26+) for every App Store upload;
        # a 18.x-SDK build is rejected at validation ("must be built with the
        # iOS 26 SDK or later"). Pick the highest Xcode 26.x present rather than
        # a fixed patch, so an image update can't silently break this.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 found on this runner"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # beta/release sign via fastlane match, which clones the private
      # lucienkerl/vmflow-ios-certs repo over SSH using a read-only deploy
      # key. metadata/screenshots/release_notes never call build_signed, so
      # they don't need cert access.
      - name: Load match deploy key
        if: inputs.lane == 'beta' || inputs.lane == 'release'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_SSH_PRIVATE_KEY }}

      - name: Run fastlane lane
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          # Decrypts the certs/profiles match reads from vmflow-ios-certs.
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          # Only consulted by the `screenshots` lane's Snapfile. This
          # runner's Xcode 16.4 image has "iPhone 16 Pro Max" but not
          # "iPhone 17 Pro Max" — both are the same 6.9-inch (1320x2868)
          # class, so either produces the correct App Store asset size.
          SNAPSHOT_DEVICE: "iPhone 16 Pro Max"
          # iPad 13" companion (2064x2752 App Store slot). Same Xcode-version
          # caveat as above: this image exposes the M4 iPad Pro 13" rather than
          # the M5 that local Xcode 26 has — same display class either way.
          SNAPSHOT_IPAD_DEVICE: "iPad Pro 13-inch (M4)"
          # Referenced via the environment rather than interpolated into the
          # script body, so a crafted ref can't become shell.
          LANE: ${{ inputs.lane }}
          NOTES: ${{ inputs.notes }}
          NOTES_SINCE: ${{ inputs.notes_since }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          ARGS=()
          case "$LANE" in
            release)
              ARGS+=("notes:$NOTES" "submit:$SUBMIT")
              if [ -n "$NOTES_SINCE" ]; then ARGS+=("since:$NOTES_SINCE"); fi
              ;;
            release_notes)
              if [ -n "$NOTES_SINCE" ]; then ARGS+=("since:$NOTES_SINCE"); fi
              ;;
          esac
          bundle exec fastlane "$LANE" "${ARGS[@]}"

      # Two things, in this order:
      #
      # 1. Tag the commit that was built, so you can always tell which source a
      #    given build came from. Two prefixes, and the distinction matters:
      #
      #      ios-v<version>-<build>      went into App Store review
      #      ios-build-<version>-<build> uploaded but not submitted (TestFlight,
      #                                  or a release dispatched with submit:false)
      #
      #    The release-notes generator diffs against `ios-v*`, so only a build
      #    that actually shipped may move that anchor — otherwise the commits in
      #    a TestFlight build would silently vanish from the next release's
      #    notes. The build number is part of both tags because the marketing
      #    version is date-based (1.0.YYMMDD) and two builds on one day would
      #    collide. Same commit re-run = same build number = same tag, which is
      #    why an existing tag is left alone rather than moved.
      #
      # 2. Commit the regenerated release_notes.txt back — only for a submitted
      #    release, since that is the run whose notes went live. The `metadata`
      #    lane uploads whatever is committed, so without this a later
      #    metadata-only run would overwrite the live notes with the stale
      #    committed ones. Best-effort: a protected branch or a concurrent push
      #    must not fail a release that already went through. The `chore(ios):`
      #    subject keeps this commit out of the next release's notes.
      - name: Tag the built commit and persist its release notes
        if: success() && (inputs.lane == 'release' || inputs.lane == 'beta')
        env:
          LANE: ${{ inputs.lane }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" VMflow/Resources/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" VMflow/Resources/Info.plist)

          SUBMITTED=false
          if [ "$LANE" = "release" ] && [ "$SUBMIT" = "true" ]; then
            SUBMITTED=true
            TAG="ios-v${VERSION}-${BUILD}"
            MSG="iOS $VERSION (build $BUILD) submitted for App Store review"
          elif [ "$LANE" = "release" ]; then
            TAG="ios-build-${VERSION}-${BUILD}"
            MSG="iOS $VERSION (build $BUILD) uploaded to App Store Connect, not submitted"
          else
            TAG="ios-build-${VERSION}-${BUILD}"
            MSG="iOS $VERSION (build $BUILD) uploaded to TestFlight"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::warning::Tag $TAG already exists — leaving it alone"
          else
            git tag -a "$TAG" -m "$MSG"
            git push origin "$TAG"
            echo "Tagged \`$TAG\` at \`$(git rev-parse --short HEAD)\` — $MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$SUBMITTED" = "true" ] && [ -n "$(git status --porcelain -- fastlane/metadata)" ]; then
            git add fastlane/metadata
            git commit -m "chore(ios): release notes for $VERSION (build $BUILD)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Committed the generated release notes to \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::Could not push the release-notes commit to ${GITHUB_REF_NAME} — commit fastlane/metadata by hand so the metadata lane stays in sync"
            fi
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: fastlane-logs
          path: |
            ios/fastlane/report.xml
            ~/Library/Logs/gym
          if-no-files-found: ignore
